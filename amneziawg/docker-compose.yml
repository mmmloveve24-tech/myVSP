services:
  awg-easy:
    image: ${AWG_IMAGE:-ghcr.io/w1k1n9cc/awg-easy:latest}
    container_name: awg-easy
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.src_valid_mark: 1
    environment:
      PASSWORD: ${PASSWORD}
      WG_HOST: ${WG_HOST}
      WG_PORT: ${WG_PORT:-51820}
      WG_DEFAULT_DNS: ${WG_DEFAULT_DNS:-1.1.1.1}
    ports:
      # AmneziaWG UDP — exposed publicly
      - "${WG_PORT:-51820}:51820/udp"
      # Web UI — bound to loopback only; reach via SSH tunnel
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-51821}:51821/tcp"
    volumes:
      - ./wg-data:/etc/wireguard
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
